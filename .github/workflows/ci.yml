name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run to catch drift while the repo is quiet: a new Garry's Mod
    # server build or runner image can break the suite without any commit
    # here changing.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: GLua Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install glualint
        env:
          # Pinned so a new release cannot fail this branch's lint overnight,
          # and checksummed so a re-uploaded release asset cannot change what
          # runs. The runner is x86-64; the release also ships aarch64.
          GLUALINT_VERSION: "1.29.0"
          GLUALINT_SHA256: "d6f962c224e8c89c186430656ed438415625524a34e3c42cd3d788d36d441e1e"
        run: |
          curl -sSLf -o glualint.zip \
            "https://github.com/FPtje/GLuaFixer/releases/download/${GLUALINT_VERSION}/glualint-${GLUALINT_VERSION}-x86_64-linux.zip"
          echo "${GLUALINT_SHA256}  glualint.zip" | sha256sum -c -
          unzip -o glualint.zip
          chmod +x glualint

      - name: Lint
        run: |
          # Templates are HTML/CSS/JS carried in .lua files; they are not Lua.
          find lua -name '*.lua' -not -path '*/templates/*' -print0 | xargs -0 ./glualint lint

  harness:
    name: Benchmark Harness
    # The harness itself only runs on demand (see benchmark.yml), so its own
    # tests are what keeps it from rotting between runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Test
        working-directory: tools/benchmark
        run: node --test

  package:
    name: Package
    # Proves every change still packs cleanly: gmad's whitelist rejects stray
    # files loudly, so breakage surfaces in the PR rather than the release.
    uses: ./.github/workflows/build.yml

  ingame:
    name: In-Game Tests
    # Boots a real Garry's Mod server and runs lua/tests/internet_benchmark/.
    # SHA-pinned (tag 0.35.2) so neither a new GLuaTest release nor a moved
    # tag can change what this branch tests.
    uses: CFC-Servers/GLuaTest/.github/workflows/run_tests.yml@d0644af6c7c273362d51951cca882c32dcd1134b # 0.35.2
    with:
      gluatest-ref: "0.35.2"
      timeout: "3"
      # Install the released gm_sysinfo module (both server architectures,
      # checksum-pinned) so the environment integration is exercised against
      # the real binary, not just the injected fakes.
      additional-setup: |
        mkdir -p garrysmod_override/lua/bin
        base="https://github.com/JoshPiper/gm_sysinfo/releases/download/v3.1.0"
        curl -sSLf -o garrysmod_override/lua/bin/gmsv_sysinfo_linux.dll "$base/gmsv_sysinfo_linux.dll"
        curl -sSLf -o garrysmod_override/lua/bin/gmsv_sysinfo_linux64.dll "$base/gmsv_sysinfo_linux64.dll"
        sha256sum -c - <<'SUMS'
        c531c3f5848dacaabc45e9d2669935f8aff046c80632ec969663ff09ec93d2e4  garrysmod_override/lua/bin/gmsv_sysinfo_linux.dll
        cf2576bc1ce2755fcd580148fd97ec414d5ba762cece5212485032dfe6459e82  garrysmod_override/lua/bin/gmsv_sysinfo_linux64.dll
        SUMS
