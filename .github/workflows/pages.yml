name: Pages

on:
  push:
    branches: [main]
  schedule:
    # An hour after ci.yml's own drift run, so a broken suite is already
    # reported by the time this tries to publish results from it.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Publishing is a read-modify-write of one branch; two at once would race.
  # Never cancel one midway, or the branch keeps a half-written report.
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the report
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install gm_sysinfo
        env:
          # Pinned and checksummed like every other third-party binary here;
          # Dependabot cannot see curl downloads, so bumps are deliberate.
          SYSINFO_VERSION: "v3.1.0"
        run: |
          mkdir -p sysinfo/lua/bin
          base="https://github.com/JoshPiper/gm_sysinfo/releases/download/${SYSINFO_VERSION}"
          curl -sSLf -o sysinfo/lua/bin/gmsv_sysinfo_linux.dll "$base/gmsv_sysinfo_linux.dll"
          curl -sSLf -o sysinfo/lua/bin/gmsv_sysinfo_linux64.dll "$base/gmsv_sysinfo_linux64.dll"
          sha256sum -c - <<'SUMS'
          c531c3f5848dacaabc45e9d2669935f8aff046c80632ec969663ff09ec93d2e4  sysinfo/lua/bin/gmsv_sysinfo_linux.dll
          cf2576bc1ce2755fcd580148fd97ec414d5ba762cece5212485032dfe6459e82  sysinfo/lua/bin/gmsv_sysinfo_linux64.dll
          SUMS

      - name: Allow core dumps
        run: echo "core" | sudo tee /proc/sys/kernel/core_pattern

      - name: Benchmark
        # A published reference measures at the trials' authored counts, not the
        # harness's smoke-test ones, so it needs room to actually finish.
        run: |
          node tools/benchmark/harness.js \
            --mode=all \
            --timeout=60 \
            --override=sysinfo

      - name: Build the page
        run: node tools/benchmark/site.js --bundle=benchmark-output

      - name: Publish to gh-pages
        env:
          # Only this subtree is ever touched, so a docs publisher can own the
          # rest of the branch without either side re-owning the other's files.
          DESTINATION: reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pages="$RUNNER_TEMP/pages"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages:gh-pages
            git worktree add "$pages" gh-pages
          else
            git worktree add --orphan -b gh-pages "$pages"
          fi

          # Pages runs Jekyll over a branch source unless told not to, which
          # would rewrite files this suite generated byte-for-byte.
          touch "$pages/.nojekyll"

          rm -rf "${pages:?}/$DESTINATION"
          mkdir -p "$pages/$DESTINATION"
          cp benchmark-output/index.html \
             benchmark-output/report.html \
             benchmark-output/results.json \
             benchmark-output/environment.txt \
             "$pages/$DESTINATION/"

          git -C "$pages" add --all
          if git -C "$pages" diff --cached --quiet; then
            echo "::notice::The report is unchanged; nothing to publish."
            exit 0
          fi

          git -C "$pages" commit -m "docs: Publish the benchmark report from ${GITHUB_SHA}"
          git -C "$pages" push origin gh-pages

      - name: Upload the report
        # The same bundle the page was cut from, so a failed or unchanged
        # publish still leaves the run's own evidence behind.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-report-${{ github.run_id }}
          path: benchmark-output
          if-no-files-found: error
