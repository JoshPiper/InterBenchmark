name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}

jobs:
  # On merge of the rolling release PR, tags the commit and creates a draft
  # GitHub release. This is kept separate from release-please-pr below: that
  # job re-derives "the latest release" from the GitHub API, and a release
  # this job just created is still a draft at that point (it isn't published
  # until publish-assets runs, later in this same workflow) - drafts don't
  # count as "found" in that lookup, so running both in one release-please
  # invocation makes it lose track of the latest release and recompute the
  # version from the entire commit history instead.
  release-please:
    name: Tag release
    if: github.repository_owner == 'JoshPiper'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # With the default GITHUB_TOKEN, CI will not run on the release PR
          # (GitHub suppresses recursive workflow triggers). Add a
          # RELEASE_PLEASE_TOKEN PAT secret to get CI runs on release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: true

  # The release is created as a draft, and a draft only materialises its git
  # tag once published, so assets are built from the release commit itself.
  # Building in the same run also avoids the GitHub quirk where tags pushed
  # with GITHUB_TOKEN don't trigger tag-push workflows.
  build-assets:
    name: Build release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  publish-assets:
    name: Provenance and publish
    needs: [release-please, build-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets, undraft the release
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # publish the attestation to the repo
      actions: read # download artifacts produced by build-assets
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Checksum assets
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS

      # Signed SLSA build provenance, queryable later with:
      #   gh attestation verify <file> -R JoshPiper/InterBenchmark
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Upload assets and undraft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" assets/* --clobber -R "${GITHUB_REPOSITORY}"
          gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false -R "${GITHUB_REPOSITORY}"

  # Opens or updates the rolling release PR. Split from the tagging job above
  # and ordered after publish-assets so that, on a push that just published a
  # release, the newly published (no longer draft) release is visible by the
  # time this looks up "the latest release" to diff commits against.
  release-please-pr:
    name: Update release PR
    needs: [release-please, build-assets, publish-assets]
    if: |
      always() && github.repository_owner == 'JoshPiper' &&
      needs.release-please.result == 'success' &&
      needs.build-assets.result != 'failure' && needs.build-assets.result != 'cancelled' &&
      needs.publish-assets.result != 'failure' && needs.publish-assets.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-release: true
